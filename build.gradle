plugins {
    id 'fabric-loom' version '1.15.3'
}

group = 'com.carloplayz'
version = '1.0.0'
base {
    archivesName.set('archersoffhand')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' } // Modmenu
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings 'net.fabricmc:yarn:1.21.11+build.4'

    modImplementation "net.fabricmc:fabric-loader:0.18.4"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.2+1.21.11"

    modImplementation "com.terraformersmc:modmenu:17.0.0-beta.2"
    modImplementation "dev.isxander:yet-another-config-lib:3.8.2+1.21.11-fabric"
}

loom {
    // Removed accesswidener since it's not being used
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

loom {
    runs {
        client {
            client()
            configName = "Minecraft Client"
            ideConfigGenerated = true
            runDir = "run"
            programArgs "--username", "CarloPlayz"
        }
    }
}