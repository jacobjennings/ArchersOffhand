plugins {
    id 'fabric-loom' version '1.11.8'
}

group = 'com.carloplayz'
version = '1.0.0'
base {
    archivesName.set('archersoffhand')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' } // Modmenu
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.8"
    mappings 'net.fabricmc:yarn:1.21.8+build.1:v2'

    modImplementation "net.fabricmc:fabric-loader:0.17.2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.134.0+1.21.8"

    modImplementation "com.terraformersmc:modmenu:15.0.0"
    modImplementation "dev.isxander:yet-another-config-lib:3.7.1+1.21.6-fabric"
}

loom {
    // Removed accesswidener since it's not being used
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
